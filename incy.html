<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://raw.githubusercontent.com https://cdn.jsdelivr.net; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="no-referrer">

    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <title>Установка конфигурации INCY...</title>
    <style>
        body {
            background-color: #0d1117; color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; text-align: center; padding: 0 20px; overflow: hidden;
        }
        .loader {
            border: 4px solid #161b22; border-top: 4px solid #58a6ff; border-radius: 50%;
            width: 48px; height: 48px; margin-bottom: 25px;
            animation: spin 1s linear infinite; transform: translateZ(0); 
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        h2 { color: #ffffff; margin-bottom: 12px; font-weight: 600; }
        p { color: #8b949e; line-height: 1.5; max-width: 450px; font-size: 15px; }
        
        .btn {
            display: none; margin-top: 30px; padding: 14px 28px;
            background-color: #238636; color: #ffffff; text-decoration: none;
            border-radius: 8px; font-weight: 600; font-size: 16px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.97); }
        .error { color: #ff7b72; display: none; margin-top: 20px; padding: 15px; border-radius: 8px; background: rgba(255,123,114,0.1); border: 1px solid rgba(255,123,114,0.4); }
    </style>
</head>
<body>
    <div class="loader" id="ui-spinner"></div>
    <h2 id="ui-title">Подготовка конфигурации...</h2>
    <p id="ui-desc">Безопасное соединение. Загружаем актуальные правила маршрутизации.</p>

    <a href="#" class="btn" id="ui-btn" rel="noopener noreferrer">🚀 Открыть в приложении INCY</a>
    <div class="error" id="ui-error">❌ Ошибка сети. Проверьте интернет или отключите VPN/AdBlock.</div>

    <script>
        const UI = {
            spinner: document.getElementById('ui-spinner'),
            title: document.getElementById('ui-title'),
            desc: document.getElementById('ui-desc'),
            btn: document.getElementById('ui-btn'),
            error: document.getElementById('ui-error')
        };

        // Защита: проверяем, что ссылка точно для INCY
        const safeRegex = /^incy:\/\/routing\/onadd\/[A-Za-z0-9+/=]+$/;

        // ПУТИ: берем файлы из папки INCY
        const sources = [
            `https://raw.githubusercontent.com/JINXPIL/flclash-converter/main/INCY/DEFAULT.DEEPLINK?t=${Date.now()}`,
            `https://cdn.jsdelivr.net/gh/JINXPIL/flclash-converter@main/INCY/DEFAULT.DEEPLINK`
        ];

        async function fetchSecureDeepLink() {
            for (let i = 0; i < sources.length; i++) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 3500);

                    const response = await fetch(sources[i], { cache: 'no-store', signal: controller.signal });
                    clearTimeout(timeoutId);

                    if (response.ok) {
                        const text = (await response.text()).trim();
                        if (safeRegex.test(text)) return text;
                        throw new Error('Payload Validation Failed');
                    }
                } catch (err) {
                    console.warn(`[CDN ${i} Failed]:`, err);
                }
            }
            throw new Error('All CDN sources failed');
        }

        fetchSecureDeepLink()
            .then(deepLink => {
                UI.spinner.style.display = 'none';
                UI.title.textContent = '✅ Конфигурация готова!';
                UI.desc.textContent = 'Если приложение не открылось автоматически, нажмите зеленую кнопку ниже.';
                
                UI.btn.href = deepLink;
                UI.btn.style.display = 'inline-block';

                requestAnimationFrame(() => {
                    setTimeout(() => { window.location.replace(deepLink); }, 300);
                });
            })
            .catch(() => {
                UI.spinner.style.display = 'none';
                UI.title.textContent = 'Системная ошибка';
                UI.desc.style.display = 'none';
                UI.error.style.display = 'block';
            });
    </script>
</body>
</html>
