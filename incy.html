<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Установка конфигурации INCY...</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://raw.githubusercontent.com https://cdn.jsdelivr.net; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
    <meta name="referrer" content="no-referrer">

    <style>
        :root { 
            --bg: #0d1117; --text-main: #c9d1d9; --text-muted: #8b949e; 
            --accent: #238636; --accent-hover: #2ea043; 
            --card: #161b22; --border: #30363d;
            --qr-scale: 1; /* Переменная масштаба */
        }
        
        body { background-color: var(--bg); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; display: flex; justify-content: center; min-height: 100vh; margin: 0; padding: 40px 20px; box-sizing: border-box; }
        main { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 400px; text-align: center; gap: 24px; }
        
        .header-block { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .loader { border: 3px solid var(--card); border-top: 3px solid #58a6ff; border-radius: 50%; width: 44px; height: 44px; animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        h2 { font-size: 22px; margin: 0; font-weight: 600; }
        p { color: var(--text-muted); line-height: 1.5; font-size: 15px; margin: 0; }
        
        /* --- СЕКЦИЯ QR-КОДА (Скрыта по умолчанию) --- */
        .qr-section { display: none; flex-direction: column; align-items: center; width: 100%; gap: 20px; animation: fadeUp 0.5s ease forwards; }
        
        /* Зона масштабирования (невидимая), чтобы кнопки не прыгали */
        .qr-stage { height: 280px; display: flex; align-items: center; justify-content: center; width: 100%; }
        
        /* Белая карточка QR-кода */
        .qr-card { background: #ffffff; padding: 12px; border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; width: 250px; height: 250px; box-sizing: border-box; transform: scale(var(--qr-scale)); transform-origin: center; transition: transform 0.1s linear; }
        .qr-card img { width: 100%; height: 100%; display: block; image-rendering: pixelated; } /* Пиксельная отрисовка, чтобы не мылило */
        
        /* --- ЖЕЛЕЗОБЕТОННЫЙ ПОЛЗУНОК --- */
        .slider-box { width: 100%; background: var(--card); padding: 16px 20px; border-radius: 12px; border: 1px solid var(--border); box-sizing: border-box; }
        .slider-box label { color: var(--text-muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 12px; }
        input[type="range"] { -webkit-appearance: none; width: 100%; background: transparent; margin: 0; padding: 0; }
        input[type="range"]:focus { outline: none; }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: var(--border); border-radius: 4px; border: none; }
        input[type="range"]::-webkit-slider-thumb { border: 1px solid #ffffff; height: 24px; width: 24px; border-radius: 50%; background: #ffffff; cursor: pointer; -webkit-appearance: none; margin-top: -8px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        input[type="range"]::-moz-range-track { width: 100%; height: 8px; cursor: pointer; background: var(--border); border-radius: 4px; border: none; }
        input[type="range"]::-moz-range-thumb { border: 1px solid #ffffff; height: 24px; width: 24px; border-radius: 50%; background: #ffffff; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        /* --- КНОПКИ --- */
        .btn-group { display: none; width: 100%; flex-direction: column; gap: 12px; animation: fadeUp 0.5s ease forwards; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; background-color: var(--accent); color: #fff; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 15px; border: none; cursor: pointer; transition: all 0.2s; user-select: none; width: 100%; box-sizing: border-box; }
        .btn:hover { background-color: var(--accent-hover); }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background-color: var(--card); border: 1px solid var(--border); color: var(--text-main); }
        .btn-secondary:hover { background-color: #1f242c; border-color: #8b949e; }
        
        .error { display: none; width: 100%; padding: 16px; border-radius: 10px; background: rgba(255,123,114,0.1); border: 1px solid rgba(255,123,114,0.3); color: #ff7b72; font-size: 14px; box-sizing: border-box; text-align: left; line-height: 1.4; }

        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <main>
        <div class="header-block">
            <div class="loader" id="ui-spinner"></div>
            <h2 id="ui-title">Загрузка...</h2>
            <p id="ui-desc">Подключаемся к базе маршрутизации.</p>
        </div>
        
        <div class="qr-section" id="qr-section">
            <div class="qr-stage">
                <div class="qr-card" id="qr-card"></div>
            </div>
            <div class="slider-box">
                <label for="qr-size">МАСШТАБ QR-КОДА</label>
                <!-- Масштаб от 0.8 (80%) до 1.4 (140%) -->
                <input type="range" id="qr-size" min="0.8" max="1.4" step="0.05" value="1">
            </div>
        </div>

        <div class="btn-group" id="btn-group">
            <a href="#" class="btn" id="ui-btn">🚀 Открыть в INCY</a>
            <button class="btn btn-secondary" id="ui-copy">📋 Скопировать код конфигурации</button>
            <button class="btn btn-secondary" id="ui-share">📤 Поделиться сайтом</button>
        </div>
        
        <div class="error" id="ui-error"></div>
    </main>

    <script>
        const DOM = {
            spinner: document.getElementById('ui-spinner'),
            title: document.getElementById('ui-title'),
            desc: document.getElementById('ui-desc'),
            qrSection: document.getElementById('qr-section'),
            qrCard: document.getElementById('qr-card'),
            qrSizeSlider: document.getElementById('qr-size'),
            btnGroup: document.getElementById('btn-group'),
            btnMain: document.getElementById('ui-btn'),
            btnCopy: document.getElementById('ui-copy'),
            btnShare: document.getElementById('ui-share'),
            error: document.getElementById('ui-error')
        };

        const LOCAL_STORAGE_KEY = 'incy_deeplink_backup';

        const sources = [
            `https://raw.githubusercontent.com/JINXPIL/flclash-converter/main/INCY/INCY_INSTALL.DEEPLINK?t=${Date.now()}`,
            `https://cdn.jsdelivr.net/gh/JINXPIL/flclash-converter@main/INCY/INCY_INSTALL.DEEPLINK`
        ];

        async function fetchConfig() {
            let fetchedLink = null;
            for (let url of sources) {
                try {
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), 3000); 
                    const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
                    clearTimeout(timeout);
                    
                    if (res.ok) {
                        const text = (await res.text()).trim();
                        // ❗️ Протокол для INCY
                        if (text.startsWith('incy://')) {
                            fetchedLink = text;
                            break;
                        }
                    }
                } catch (e) {}
            }

            if (fetchedLink) {
                localStorage.setItem(LOCAL_STORAGE_KEY, fetchedLink);
                return fetchedLink;
            } else {
                const backup = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (backup) {
                    DOM.title.innerHTML = '⚠️ Режим Оффлайн';
                    return backup;
                }
                throw new Error('NETWORK_AND_NO_BACKUP');
            }
        }

        async function init() {
            try {
                const link = await fetchConfig();
                
                DOM.spinner.style.display = 'none';
                if (DOM.title.innerHTML !== '⚠️ Режим Оффлайн') {
                    DOM.title.textContent = '✅ Готово к установке';
                }
                
                DOM.btnMain.href = link;
                
                // Кнопки теперь появляются СРАЗУ (для всех устройств)
                DOM.btnGroup.style.display = 'flex';

                // Для всех экранов больше 768px пытаемся отрисовать QR-код
                if (window.innerWidth > 768) {
                    DOM.desc.innerHTML = 'Отсканируйте камерой смартфона или скопируйте ссылку в десктопный клиент.';
                    try {
                        const svgString = generateQR(link);
                        DOM.qrCard.innerHTML = svgString;
                        DOM.qrSection.style.display = 'flex';
                    } catch (e) {
                        console.warn('QR Limit Exceeded');
                    }

                    DOM.qrSizeSlider.addEventListener('input', function() {
                        document.documentElement.style.setProperty('--qr-scale', this.value);
                    });
                } else {
                    DOM.desc.textContent = 'Нажмите зеленую кнопку, чтобы применить правила.';
                }

                // ВАЖНО: АВТОМАТИЧЕСКОЕ ОТКРЫТИЕ ДЛЯ ВСЕХ УСТРОЙСТВ
                setTimeout(() => window.location.replace(link), 300);

                DOM.btnCopy.onclick = async () => {
                    try {
                        await navigator.clipboard.writeText(link);
                        DOM.btnCopy.innerHTML = '✅ Скопировано в буфер!';
                        DOM.btnCopy.style.borderColor = 'var(--accent)';
                        DOM.btnCopy.style.color = 'var(--accent)';
                        setTimeout(() => {
                            DOM.btnCopy.innerHTML = '📋 Скопировать код конфигурации';
                            DOM.btnCopy.style.borderColor = 'var(--border)';
                            DOM.btnCopy.style.color = 'var(--text-main)';
                        }, 2000);
                    } catch (e) { prompt('Скопируйте эту ссылку:', link); }
                };

                DOM.btnShare.onclick = async () => {
                    // ❗️ Ссылка на INCY
                    const shareData = { title: 'Network Builder', text: 'Установи профиль маршрутизации в 1 клик!', url: 'https://jinxpil.github.io/flclash-converter/incy.html' };
                    if (navigator.share) {
                        try { await navigator.share(shareData); } catch (err) {}
                    } else {
                        try {
                            await navigator.clipboard.writeText(`${shareData.text} ${shareData.url}`);
                            DOM.btnShare.innerHTML = '✅ Ссылка на сайт скопирована!';
                            setTimeout(() => { DOM.btnShare.innerHTML = '📤 Поделиться сайтом'; }, 2000);
                        } catch (e) { prompt('Скопируйте ссылку:', shareData.url); }
                    }
                };

            } catch (err) {
                DOM.spinner.style.display = 'none';
                DOM.title.textContent = 'Ошибка загрузки';
                DOM.desc.style.display = 'none';
                
                DOM.error.innerHTML = '<b>❌ Сетевой сбой</b><br>Файл недоступен и нет сохраненной копии. Пожалуйста, проверьте интернет.';
                DOM.error.style.display = 'block';
            }
        }
        
        init();
    </script>
</body>
</html>
