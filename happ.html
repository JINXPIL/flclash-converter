<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Установка конфигурации Happ...</title>
    <!-- Библиотека загружается сразу и надежно -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
        .loader { border: 4px solid #161b22; border-top: 4px solid #58a6ff; border-radius: 50%; width: 44px; height: 44px; margin-bottom: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        h2 { color: #ffffff; margin: 0 0 10px 0; }
        p { color: #8b949e; font-size: 15px; margin: 0; max-width: 400px; }
        
        /* --- Идеальный блок QR-кода --- */
        #qr-section { display: none; flex-direction: column; align-items: center; margin-top: 25px; }
        
        /* Зона для QR-кода (чтобы при увеличении он не сдвигал кнопки вниз) */
        .qr-stage { height: 280px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
        
        /* Сама белая карточка. Меняет размер плавно через transform */
        .qr-card { background: #ffffff; padding: 12px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); transition: transform 0.1s; }
        .qr-card canvas { display: block; }
        
        /* --- Красивый ползунок --- */
        .slider-box { background: #161b22; border: 1px solid #30363d; padding: 12px 20px; border-radius: 10px; width: 250px; box-sizing: border-box; }
        .slider-box label { color: #8b949e; font-size: 11px; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 10px; }
        input[type="range"] { -webkit-appearance: none; width: 100%; background: transparent; outline: none; margin: 0; }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #30363d; border-radius: 4px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #ffffff; cursor: pointer; margin-top: -6px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        
        /* --- Кнопки --- */
        .btn { display: none; margin-top: 15px; padding: 14px 20px; background-color: #238636; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 15px; width: 250px; box-sizing: border-box; cursor: pointer; border: none; }
        .btn-copy { background-color: #21262d; border: 1px solid #30363d; margin-top: 10px; }
        .error { color: #ff7b72; display: none; margin-top: 20px; padding: 15px; background: rgba(255,123,114,0.1); border-radius: 8px; border: 1px solid rgba(255,123,114,0.4); max-width: 400px; }
    </style>
</head>
<body>
    <div class="loader" id="loader"></div>
    <h2 id="title">Загрузка...</h2>
    <p id="desc">Получаем конфигурацию с сервера.</p>

    <!-- Секция QR -->
    <div id="qr-section">
        <div class="qr-stage">
            <div class="qr-card" id="qr-card">
                <canvas id="qr-canvas"></canvas>
            </div>
        </div>
        <div class="slider-box">
            <label>Масштаб QR-кода</label>
            <input type="range" id="qr-size" min="0.8" max="1.5" step="0.05" value="1">
        </div>
    </div>

    <a href="#" class="btn" id="btn-open">🚀 Открыть в Happ</a>
    <button class="btn btn-copy" id="btn-copy">📋 Скопировать ссылку</button>
    
    <div class="error" id="error-msg"></div>

    <script>
        const sources = [
            `https://raw.githubusercontent.com/JINXPIL/flclash-converter/main/HAPP/HAPP_INSTALL.DEEPLINK?t=${Date.now()}`,
            `https://cdn.jsdelivr.net/gh/JINXPIL/flclash-converter@main/HAPP/HAPP_INSTALL.DEEPLINK`
        ];

        async function fetchConfig() {
            for (let url of sources) {
                try {
                    const res = await fetch(url, { cache: 'no-store' });
                    if (res.ok) {
                        const text = (await res.text()).trim();
                        if (text.startsWith('happ://')) return text;
                    }
                } catch (e) {}
            }
            throw new Error('FAIL');
        }

        fetchConfig().then(link => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('title').textContent = '✅ Готово к установке!';
            
            const isMobile = /Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth <= 768;

            if (isMobile) {
                document.getElementById('desc').textContent = 'Нажмите кнопку ниже, чтобы применить правила.';
                setTimeout(() => window.location.replace(link), 300);
            } else {
                document.getElementById('desc').innerHTML = 'Отсканируйте камерой смартфона или скопируйте ссылку.';
                
                // Рисуем четкий QR-код ОДИН РАЗ
                new QRious({
                    element: document.getElementById('qr-canvas'),
                    value: link,
                    size: 250,
                    level: 'L'
                });
                
                document.getElementById('qr-section').style.display = 'flex';
                
                // Масштабируем саму карточку через CSS (никаких белых рамок)
                document.getElementById('qr-size').addEventListener('input', function() {
                    document.getElementById('qr-card').style.transform = `scale(${this.value})`;
                });
            }

            // Показываем кнопки
            const btnOpen = document.getElementById('btn-open');
            btnOpen.href = link;
            btnOpen.style.display = 'block';

            const btnCopy = document.getElementById('btn-copy');
            btnCopy.style.display = 'block';
            btnCopy.onclick = () => {
                navigator.clipboard.writeText(link).then(() => {
                    btnCopy.textContent = '✅ Скопировано!';
                    btnCopy.style.backgroundColor = '#238636';
                    btnCopy.style.borderColor = '#238636';
                    setTimeout(() => {
                        btnCopy.textContent = '📋 Скопировать ссылку';
                        btnCopy.style.backgroundColor = '#21262d';
                        btnCopy.style.borderColor = '#30363d';
                    }, 2000);
                }).catch(() => alert('Не удалось скопировать.'));
            };

        }).catch(() => {
            // Если произошла ошибка - прячем всё и показываем текст
            document.getElementById('loader').style.display = 'none';
            document.getElementById('title').textContent = 'Ошибка загрузки';
            document.getElementById('desc').style.display = 'none';
            document.getElementById('qr-section').style.display = 'none';
            
            const err = document.getElementById('error-msg');
            err.textContent = '❌ Не удалось скачать файл конфигурации. Проверьте интернет или отключите блокировщики рекламы.';
            err.style.display = 'block';
        });
    </script>
</body>
</html>
