<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    
    <!-- CSP: разрешили загрузку новой мощной библиотеки QRious -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://raw.githubusercontent.com https://cdn.jsdelivr.net; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; img-src data:;">
    <title>Установка конфигурации Happ...</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; padding: 0 20px; overflow-y: auto; }
        .loader { border: 4px solid #161b22; border-top: 4px solid #58a6ff; border-radius: 50%; width: 48px; height: 48px; margin-bottom: 25px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        h2 { color: #ffffff; margin-bottom: 12px; }
        p { color: #8b949e; line-height: 1.5; max-width: 450px; }
        
        .btn { display: none; margin-top: 25px; padding: 14px 28px; background-color: #238636; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 16px; width: 250px; box-sizing: border-box; }
        .btn-copy { background-color: #21262d; border: 1px solid #30363d; margin-top: 12px; cursor: pointer; }
        .btn-copy:hover { background-color: #30363d; }
        .error { color: #ff7b72; display: none; margin-top: 20px; padding: 15px; border-radius: 8px; background: rgba(255,123,114,0.1); border: 1px solid rgba(255,123,114,0.4); }
        
        /* Адаптивный контейнер для QR-кода */
        .qr-container { display: none; margin-top: 25px; background: #ffffff; padding: 15px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); width: fit-content; }
        .qr-container canvas { display: block; margin: 0 auto; transition: width 0.1s; }
        .qr-hint { color: #8b949e; font-size: 13px; margin-top: 15px; }

        /* Стили для ползунка */
        .slider-box { display: none; margin-top: 15px; width: 100%; max-width: 300px; }
        .slider-box label { color: #8b949e; font-size: 13px; display: block; margin-bottom: 8px; }
        .slider-box input[type="range"] { width: 100%; accent-color: #238636; cursor: pointer; }
    </style>
    <!-- Подключаем QRious - лучшую библиотеку для тяжелых данных -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
</head>
<body>
    <div class="loader" id="ui-spinner"></div>
    <h2 id="ui-title">Подготовка конфигурации...</h2>
    <p id="ui-desc">Безопасное соединение. Загружаем актуальные правила маршрутизации.</p>
    
    <div class="qr-container" id="qr-box">
        <canvas id="qr-canvas"></canvas>
    </div>
    
    <div class="qr-hint" id="qr-hint" style="display:none;">Отсканируйте камерой телефона</div>

    <!-- Ползунок управления размером -->
    <div class="slider-box" id="slider-box">
        <label for="qr-size">Размер QR-кода:</label>
        <input type="range" id="qr-size" min="200" max="650" step="10" value="350">
    </div>

    <a href="#" class="btn" id="ui-btn">🚀 Открыть в приложении Happ</a>
    <button class="btn btn-copy" id="ui-copy">📋 Скопировать ссылку</button>
    
    <div class="error" id="ui-error"></div>

    <script>
        const sources = [
            `https://raw.githubusercontent.com/JINXPIL/flclash-converter/main/HAPP/HAPP_INSTALL.DEEPLINK?t=${Date.now()}`,
            `https://cdn.jsdelivr.net/gh/JINXPIL/flclash-converter@main/HAPP/HAPP_INSTALL.DEEPLINK`
        ];

        async function fetchLink() {
            let lastError = '';
            for (let url of sources) {
                try {
                    const res = await fetch(url, { cache: 'no-store' });
                    if (res.status === 404) throw new Error('404');
                    if (res.ok) {
                        const text = (await res.text()).trim();
                        // Проверяем протокол happ://
                        if (text.startsWith('happ://')) return text;
                    }
                } catch (e) { lastError = e.message; }
            }
            throw new Error(lastError === '404' ? '404' : 'NETWORK');
        }

        fetchLink().then(link => {
            document.getElementById('ui-spinner').style.display = 'none';
            document.getElementById('ui-title').textContent = '✅ Конфигурация готова!';
            document.getElementById('ui-desc').innerHTML = 'На телефоне приложение откроется само.<br><b>На ПК:</b> отсканируйте QR-код или скопируйте ссылку.';
            
            document.getElementById('ui-btn').href = link;
            document.getElementById('ui-btn').style.display = 'block';
            
            const copyBtn = document.getElementById('ui-copy');
            copyBtn.style.display = 'block';
            copyBtn.onclick = function() {
                navigator.clipboard.writeText(link).then(() => {
                    copyBtn.textContent = '✅ Скопировано!';
                    copyBtn.style.backgroundColor = '#238636';
                    copyBtn.style.borderColor = '#238636';
                }).catch(err => {
                    alert('Не удалось скопировать. Выделите ссылку вручную.');
                });
            };

            // Генерация QR-кода
            try {
                const qrCanvas = document.getElementById('qr-canvas');
                const defaultSize = 350;
                
                // Создаем инстанс QR
                const qr = new QRious({
                    element: qrCanvas,
                    value: link,
                    size: defaultSize,
                    level: 'L'
                });
                
                // Отображаем элементы
                document.getElementById('qr-box').style.display = 'block';
                document.getElementById('qr-hint').style.display = 'block';
                document.getElementById('slider-box').style.display = 'block';

                // Подключаем ползунок к размеру QR-кода
                const slider = document.getElementById('qr-size');
                slider.addEventListener('input', function() {
                    qr.size = parseInt(this.value, 10);
                });

            } catch (e) {
                console.warn('Ошибка рендера QR-кода', e);
            }

            setTimeout(() => window.location.replace(link), 300);

        }).catch(err => {
            document.getElementById('ui-spinner').style.display = 'none';
            document.getElementById('ui-title').textContent = 'Ошибка загрузки';
            document.getElementById('ui-desc').style.display = 'none';
            const errBox = document.getElementById('ui-error');
            if (err.message === '404') {
                errBox.innerHTML = '❌ Файл диплинка ещё не создан!<br><br>Зайдите на GitHub во вкладку <b>Actions</b> и нажмите <b>Run workflow</b>.';
            } else {
                errBox.textContent = '❌ Ошибка сети. Отключите VPN/AdBlock или попробуйте позже.';
            }
            errBox.style.display = 'block';
        });
    </script>
</body>
</html>
