<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://raw.githubusercontent.com https://cdn.jsdelivr.net; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
    <title>Установка конфигурации Happ...</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; padding: 0 20px; }
        .loader { border: 4px solid #161b22; border-top: 4px solid #58a6ff; border-radius: 50%; width: 48px; height: 48px; margin-bottom: 25px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        h2 { color: #ffffff; margin-bottom: 12px; }
        p { color: #8b949e; line-height: 1.5; max-width: 450px; }
        .btn { display: none; margin-top: 30px; padding: 14px 28px; background-color: #238636; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 16px; }
        .error { color: #ff7b72; display: none; margin-top: 20px; padding: 15px; border-radius: 8px; background: rgba(255,123,114,0.1); border: 1px solid rgba(255,123,114,0.4); }
    </style>
</head>
<body>
    <div class="loader" id="ui-spinner"></div>
    <h2 id="ui-title">Подготовка конфигурации...</h2>
    <p id="ui-desc">Безопасное соединение. Загружаем актуальные правила маршрутизации.</p>
    <a href="#" class="btn" id="ui-btn">🚀 Открыть в приложении Happ</a>
    <div class="error" id="ui-error"></div>

    <script>
        const sources = [
            `https://raw.githubusercontent.com/JINXPIL/flclash-converter/main/HAPP_INSTALL.DEEPLINK?t=${Date.now()}`,
            `https://cdn.jsdelivr.net/gh/JINXPIL/flclash-converter@main/HAPP_INSTALL.DEEPLINK`
        ];

        async function fetchLink() {
            let lastError = '';
            for (let url of sources) {
                try {
                    const res = await fetch(url, { cache: 'no-store' });
                    if (res.status === 404) throw new Error('404');
                    if (res.ok) {
                        const text = (await res.text()).trim();
                        if (text.startsWith('happ://')) return text;
                    }
                } catch (e) { lastError = e.message; }
            }
            throw new Error(lastError === '404' ? '404' : 'NETWORK');
        }

        fetchLink().then(link => {
            document.getElementById('ui-spinner').style.display = 'none';
            document.getElementById('ui-title').textContent = '✅ Конфигурация готова!';
            document.getElementById('ui-desc').textContent = 'Если приложение не открылось автоматически, нажмите зеленую кнопку.';
            document.getElementById('ui-btn').href = link;
            document.getElementById('ui-btn').style.display = 'inline-block';
            setTimeout(() => window.location.replace(link), 300);
        }).catch(err => {
            document.getElementById('ui-spinner').style.display = 'none';
            document.getElementById('ui-title').textContent = 'Ошибка загрузки';
            document.getElementById('ui-desc').style.display = 'none';
            const errBox = document.getElementById('ui-error');
            if (err.message === '404') {
                errBox.innerHTML = '❌ Файл диплинка ещё не создан!<br><br>Зайдите на GitHub во вкладку <b>Actions</b> и нажмите <b>Run workflow</b>, чтобы бот сгенерировал ссылки.';
            } else {
                errBox.textContent = '❌ Ошибка сети. Отключите VPN/AdBlock или попробуйте позже.';
            }
            errBox.style.display = 'block';
        });
    </script>
</body>
</html>
