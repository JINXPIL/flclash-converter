name: ⚡ Network Builder - Auto-Deploy

on:
  workflow_dispatch: 
  push:
    branches:
      - main
    paths:
      - 'HAPP/DEFAULT.json' # Теперь бот следит за файлом в папке HAPP

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Build Happ & Incy Configs and Deeplinks
        shell: bash
        run: |
          set -euo pipefail
          
          # Получаем текущее время
          NOW_EPOCH="$(date -u +%s)"
          
          # 1. Обновляем время в исходном файле HAPP/DEFAULT.json
          tmp="$(mktemp)"
          jq --arg ts "$NOW_EPOCH" '.LastUpdated = $ts' HAPP/DEFAULT.json > "$tmp"
          mv "$tmp" HAPP/DEFAULT.json
          
          # 2. Создаем папку INCY и копируем туда актуальный JSON
          # (чтобы у пользователей INCY был свой файл для скачивания)
          mkdir -p INCY
          cp HAPP/DEFAULT.json INCY/DEFAULT.json
          
          # 3. Сжимаем JSON и кодируем в Base64
          BASE64=$(jq -c . HAPP/DEFAULT.json | base64 -w 0)
          
          # 4. Создаем магические ссылки (диплинки) для обоих клиентов!
          printf 'happ://routing/onadd/%s\n' "$BASE64" > HAPP/DEFAULT.DEEPLINK
          printf 'incy://routing/onadd/%s\n' "$BASE64" > INCY/DEFAULT.DEEPLINK

      - name: 🚀 Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Добавляем папки HAPP и INCY целиком
          git add HAPP/ INCY/
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          
          git commit -m "⚡ Auto-update Happ & Incy configs [$(date -u +%Y-%m-%d %H:%M)]"
          git push
