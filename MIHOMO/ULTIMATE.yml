proxy-groups:
  - name: "🚀 Выбор сервера"
    type: select
    proxies:
      - "♻️ Автовыбор"
      - "🤖 Premium AI (Auto)"
    use:
      - igareck_mobile_black
      - zieng2_universal
      - igareck_white_1
      - goida_26

  - name: "♻️ Автовыбор"
    type: url-test
    url: "http://cp.cloudflare.com/generate_204"
    interval: 180
    tolerance: 30
    timeout: 5000
    lazy: true
    exclude-filter: "(?i)Россия|Russia|Украина|Ukraine|Молдова|Moldova|РФ|России"
    use:
      - igareck_mobile_black
      - zieng2_universal
