  # --- STUN (WebRTC) ---
  # Перенесено из начала: заблокированные мессенджеры сюда уже не доходят.
  # Цена DIRECT — WebRTC узнаёт твой реальный IP. Если звонки нормально
  # работают через прокси, строку лучше удалить.
  - DST-PORT,3478-3479/19302,DIRECT

  # --- СНГ по IP ---
  # GEOIP,RU БЕЗ no-resolve: домены с зарубежными TLD на хостингах РФ,
  # не попавшие ни в один список выше, резолвятся и уходят в DIRECT,
  # а не в MATCH,PROXY. Цена: каждый такой домен резолвится через
  # nameserver mihomo в момент подключения (+задержка на первом запросе),
  # а если nameserver российский (dns.yandex.ru и т.п.) — он видит список
  # всех посещаемых зарубежных доменов. См. отчёт: нужен зарубежный DoH.
  # BY/KZ/UZ ниже используют уже полученный здесь IP.
  - GEOIP,RU,DIRECT
  - GEOIP,BY,DIRECT,no-resolve
  - GEOIP,KZ,DIRECT,no-resolve
  - GEOIP,UZ,DIRECT,no-resolve

