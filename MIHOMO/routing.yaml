  # Мусорные порты: NetBIOS, SMB, SSDP, mDNS, Delivery Optimization.
  # Стоят ПОСЛЕ LAN-адресов: шары/принтеры в своей сети работают, а SMB
  # наружу (утечка NTLM-хеша через \\host\share) режется. Хочешь резать SMB
  # и внутри сети общежития (защита от Responder / NTLM-relay) — подними
  # строку выше IP-CIDR (сработает, если LAN-трафик вообще попадает в TUN).
  - DST-PORT,137-139/445/1900/5353/7680,REJECT

  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR,255.255.255.255/32,DIRECT,no-resolve
  - IP-CIDR6,ff00::/8,DIRECT,no-resolve

