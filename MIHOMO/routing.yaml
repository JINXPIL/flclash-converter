rules:
  # ================================================================
  # 0.0 ИНСТРУМЕНТЫ ИБ / АНАЛИЗАТОРЫ ТРАФИКА → DIRECT
  # Это не «сброс из TUN»: пакеты всё равно проходят TUN-стек, правило
  # лишь выбирает DIRECT. Для сканирования (nmap, Docker/WSL2) цели нужно
  # добавлять в tun.route-exclude-address — иначе TUN сам завершает
  # TCP-рукопожатие и порты выглядят открытыми. Трафик из Docker/WSL2
  # по имени процесса не опознаётся вообще.
  # ================================================================
  - PROCESS-NAME,wireshark.exe,DIRECT
  - PROCESS-NAME,dumpcap.exe,DIRECT
  - PROCESS-NAME,nmap.exe,DIRECT
  - PROCESS-NAME,ncat.exe,DIRECT
  - PROCESS-NAME,nping.exe,DIRECT
  - PROCESS-NAME,fiddler.exe,DIRECT
  - PROCESS-NAME,charles.exe,DIRECT
  - PROCESS-NAME,proxifier.exe,DIRECT
  - PROCESS-NAME,BurpSuiteCommunity.exe,DIRECT
  - PROCESS-NAME,BurpSuitePro.exe,DIRECT
  - PROCESS-NAME,mitmproxy.exe,DIRECT
  - PROCESS-NAME,mitmdump.exe,DIRECT
  - PROCESS-NAME,mitmweb.exe,DIRECT

  # ================================================================
  # 0.1 БЛОКИРОВКИ: майнеры, телеметрия, реклама, трекеры
  # Стоит ВЫШЕ системных DIRECT. Раньше vivo.com.cn и svchost.exe
  # (DiagTrack работает внутри svchost) перехватывали трафик до REJECT,
  # и часть блокировок была мёртвой. Если после исправления что-то
  # в системе отвалится — проверь этот блок первым.
  # ================================================================
  - RULE-SET,block-domains,REJECT                # Блокировки: майнеры, телеметрия, реклама, трекеры (0.1)
  - DOMAIN-REGEX,^adservice\.google\.,REJECT   # все adservice.google.* вместо двух случайных стран

  # ================================================================
  # 0.2 ЛОКАЛЬНАЯ СЕТЬ
  # ================================================================
  - DOMAIN-SUFFIX,localhost,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,home.arpa,DIRECT
  - DOMAIN-SUFFIX,internal,DIRECT
  - DOMAIN,my.keenetic.net,DIRECT
  - DOMAIN-SUFFIX,keenetic.link,DIRECT
  - DOMAIN,router.asus.com,DIRECT
  - DOMAIN,tplinkwifi.net,DIRECT
  - DOMAIN,tplinklogin.net,DIRECT
  - DOMAIN-SUFFIX,3gppnetwork.org,DIRECT       # VoLTE / VoWiFi (IMS)
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  # Мусорные порты: NetBIOS, SMB, SSDP, mDNS, Delivery Optimization.
  # Стоят ПОСЛЕ LAN-адресов: шары/принтеры в своей сети работают, а SMB
  # наружу (утечка NTLM-хеша через \\host\share) режется. Хочешь резать SMB
  # и внутри сети общежития (защита от Responder / NTLM-relay) — подними
  # строку выше IP-CIDR (сработает, если LAN-трафик вообще попадает в TUN).
  - DST-PORT,137-139/445/1900/5353/7680,REJECT
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR,255.255.255.255/32,DIRECT,no-resolve
  - IP-CIDR6,ff00::/8,DIRECT,no-resolve

  # ================================================================
  # 0.3 СИСТЕМА: проверки связи, captive-порталы, push, время, обновления
  # ================================================================
  - DOMAIN,ipv6.msftconnecttest.com,REJECT     # раньше стоял ПОСЛЕ suffix-DIRECT и не срабатывал
  - RULE-SET,system-domains,DIRECT               # Системные проверки связи, captive-порталы, push, обновления (0.3)
  - PROCESS-NAME,com.vivo.pushservice,DIRECT   # было DOMAIN-SUFFIX, но это имя пакета, а не домен
  - DST-PORT,5228-5230,DIRECT                  # FCM (mtalk.google.com)
  # --- Время ---
  - DST-PORT,123,DIRECT
  # --- Системные процессы ---
  - PROCESS-NAME,svchost.exe,DIRECT
  - PROCESS-NAME,System,DIRECT
  - PROCESS-NAME,nsurlsessiond,DIRECT
  - PROCESS-NAME,apsd,DIRECT
  - PROCESS-NAME,trustd,DIRECT

  # ================================================================
  # 0.4 ТОРРЕНТЫ → только напрямую (чтобы не ловить абузы на VPS)
  # DOMAIN-KEYWORD torrent/announce убраны: они отправляли в DIRECT
  # заблокированные торрент-сайты в браузере, а сами клиенты и так
  # ловятся по процессу. PROCESS-NAME не чувствителен к регистру.
  # ================================================================
  - RULE-SET,torrent-apps,DIRECT                 # Торрент-клиенты Windows/Linux/macOS/Android (0.4)

  # ================================================================
  # 0.5 DNS / DoH
  # Health-check'и прокси-групп через правила НЕ идут (проверяются через
  # каждый узел), так что cp.cloudflare.com влияет только на приложения.
  # Китайские DoH/IP нужны, только если они прописаны в секции dns:
  # при respect-rules: true — иначе этот блок можно удалить.
  # ================================================================
  - DOMAIN,cp.cloudflare.com,DIRECT
  - DOMAIN-SUFFIX,doh.pub,DIRECT
  - DOMAIN-SUFFIX,alidns.com,DIRECT
  - IP-CIDR,120.53.53.53/32,DIRECT,no-resolve
  - IP-CIDR,114.114.114.114/32,DIRECT,no-resolve
  - IP-CIDR,42.81.82.209/32,DIRECT,no-resolve

  # ================================================================
  # 1. ПРИЛОЖЕНИЯ РФ (Android) → DIRECT
  # Трафик всё равно проходит через TUN, и банки/Госуслуги видят
  # активный VPN. Надёжнее исключить их из VPN в самом клиенте
  # (per-app / exclude-package), а эти правила оставить подстраховкой.
  # ================================================================
  - RULE-SET,ru-apps,DIRECT                      # Российские приложения Android (1.0)

  # ================================================================
  # 1.1 ИСКЛЮЧЕНИЯ ИЗ ЗОНЫ .ru → PROXY (СТРОГО до DOMAIN-SUFFIX,ru)
  # ================================================================
  # --- AliExpress CIS: сессия целиком через прокси ---
  # В Крыму AliExpress режет вход и заказы по IP, а split-routing (часть
  # доменов напрямую, часть через прокси) рвёт сессию и антифрод.
  # QUIC режем здесь же: блок 1.1 стоит ВЫШЕ общего QUIC-фильтра (2.0),
  # иначе HTTP/3 AliExpress шёл бы через прокси по UDP.
  - AND,((NETWORK,UDP),(DST-PORT,443),(PROCESS-NAME,ru.aliexpress.buyer)),REJECT
  - AND,((NETWORK,UDP),(DST-PORT,443),(PROCESS-NAME,com.alibaba.aliexpresshd)),REJECT
  - AND,((NETWORK,UDP),(DST-PORT,443),(DOMAIN-KEYWORD,aliexpress)),REJECT
  # Приложение целиком: его HTTPDNS отдаёт голые IP (часто российские),
  # которые без этого правила уходили бы в GEOIP,RU → DIRECT.
  - PROCESS-NAME,ru.aliexpress.buyer,PROXY          # AliExpress Россия (пакет подтверждён логом FlClash)
  - PROCESS-NAME,com.alibaba.aliexpresshd,PROXY     # глобальная версия
  - RULE-SET,ru-exceptions,PROXY                 # Исключения из зоны .ru и DIRECT-вендоров → PROXY (1.1)
  - DOMAIN-KEYWORD,aliexpress,PROXY            # страховка: любые *aliexpress* хосты (.su, .us, новые CDN)

  # ================================================================
  # 1.2 РФ, КРЫМ, СНГ → DIRECT (по доменам)
  # ================================================================
  - RULE-SET,direct-domains,DIRECT               # РФ, Крым, СНГ, вендоры, игровые CDN → DIRECT (1.2)

  # ================================================================
  # 2. QUIC (UDP/443) → REJECT для всего, что дальше уйдёт в прокси
  # Раньше правило стояло в самом конце и не касалось YouTube, Google
  # и остальных сервисов из списков ниже — они совпадали с PROXY раньше.
  # Теперь RU-сервисы выше сохраняют HTTP/3, а проксируемое уходит на TCP.
  # Если основной протокол — Hysteria2/TUIC, строку можно убрать.
  # ================================================================
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT

  # ================================================================
  # 3. ПРОКСИРУЕМЫЕ СЕРВИСЫ
  # Стоят ДО GEOIP,RU. Раз GEOIP,RU теперь резолвит домены, эти списки —
  # единственное, что удерживает зарубежный сервис в прокси, если его
  # домен срезолвится в российский IP (кеш-узлы CDN у провайдеров РФ).
  # ================================================================
  - RULE-SET,proxy-apps,PROXY                    # Приложения заблокированных сервисов и игровые лаунчеры (3.0)
  - RULE-SET,proxy-domains,PROXY                 # Проксируемые сервисы (3.0)
  - RULE-SET,proxy-keywords,PROXY                # Ключевые слова — страховка в конце блока 3.0

  # ================================================================
  # 4. ПРАВИЛА ПО IP (соединения без домена)
  # Telegram и Meta стоят ДО STUN: медиа звонков мессенджеров идёт на
  # голые IP (WhatsApp — в т.ч. UDP 3478) и раньше уходило в DIRECT,
  # где звонки в РФ ограничены.
  # ================================================================
  - RULE-SET,proxy-ip,PROXY,no-resolve           # Подсети Telegram и Meta (4.0)
  - GEOIP,telegram,PROXY,no-resolve
  # --- STUN (WebRTC) ---
  # Перенесено из начала: заблокированные мессенджеры сюда уже не доходят.
  # Цена DIRECT — WebRTC узнаёт твой реальный IP. Если звонки нормально
  # работают через прокси, строку лучше удалить.
  - DST-PORT,3478-3479/19302,DIRECT
  # --- СНГ по IP ---
  # GEOIP,RU БЕЗ no-resolve: домены с зарубежными TLD на хостингах РФ,
  # не попавшие ни в один список выше, резолвятся и уходят в DIRECT,
  # а не в MATCH,PROXY. Цена: каждый такой домен резолвится через
  # nameserver mihomo в момент подключения (+задержка на первом запросе),
  # а если nameserver российский (dns.yandex.ru и т.п.) — он видит список
  # всех посещаемых зарубежных доменов. См. отчёт: нужен зарубежный DoH.
  # BY/KZ/UZ ниже используют уже полученный здесь IP.
  - GEOIP,RU,DIRECT
  - GEOIP,BY,DIRECT,no-resolve
  - GEOIP,KZ,DIRECT,no-resolve
  - GEOIP,UZ,DIRECT,no-resolve

  # ================================================================
  # 5. ВСЁ ОСТАЛЬНОЕ
  # ================================================================
  - MATCH,PROXY
