  # ================================================================
  # 2. QUIC (UDP/443) → REJECT для всего, что дальше уйдёт в прокси
  # Раньше правило стояло в самом конце и не касалось YouTube, Google
  # и остальных сервисов из списков ниже — они совпадали с PROXY раньше.
  # Теперь RU-сервисы выше сохраняют HTTP/3, а проксируемое уходит на TCP.
  # Если основной протокол — Hysteria2/TUIC, строку можно убрать.
  # ================================================================
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT

