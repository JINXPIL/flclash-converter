# Mihomo (Clash Meta) — правила маршрутизации, исправленная версия
# Drop-in замена секции rules:. Используется только группа PROXY,
# GEOSITE и внешние rule-providers не нужны (GEOIP,telegram — как было).
# v2: слито с flclash-converter INCY/DEFAULT.json и MIHOMO/ULTIMATE.yml
#     (только явные домены/процессы/IP; GEOSITE и RULE-SET не переносились).
# Порядок блоков важен (первое совпадение выигрывает):
#   ИБ-инструменты → блокировки → LAN → система → торренты → DNS →
#   приложения РФ → исключения из .ru → РФ DIRECT → QUIC-фильтр →
#   прокси-сервисы → правила по IP → MATCH
rules:
  # ================================================================
  # 0.0 ИНСТРУМЕНТЫ ИБ / АНАЛИЗАТОРЫ ТРАФИКА → DIRECT
  # Это не «сброс из TUN»: пакеты всё равно проходят TUN-стек, правило
  # лишь выбирает DIRECT. Для сканирования (nmap, Docker/WSL2) цели нужно
  # добавлять в tun.route-exclude-address — иначе TUN сам завершает
  # TCP-рукопожатие и порты выглядят открытыми. Трафик из Docker/WSL2
  # по имени процесса не опознаётся вообще.
  # ================================================================
  - PROCESS-NAME,wireshark.exe,DIRECT
  - PROCESS-NAME,dumpcap.exe,DIRECT
  - PROCESS-NAME,nmap.exe,DIRECT
  - PROCESS-NAME,ncat.exe,DIRECT
  - PROCESS-NAME,nping.exe,DIRECT
  - PROCESS-NAME,fiddler.exe,DIRECT
  - PROCESS-NAME,charles.exe,DIRECT
  - PROCESS-NAME,proxifier.exe,DIRECT
  - PROCESS-NAME,BurpSuiteCommunity.exe,DIRECT
  - PROCESS-NAME,BurpSuitePro.exe,DIRECT
  - PROCESS-NAME,mitmproxy.exe,DIRECT
  - PROCESS-NAME,mitmdump.exe,DIRECT
  - PROCESS-NAME,mitmweb.exe,DIRECT

