# Mihomo (Clash Meta) — правила v5: inline rule-providers + короткая политика
# Вставляется ДВУМЯ секциями: rule-providers: и rules: (ядро mihomo ≥ 1.19).
# Маршрутизация идентична плоской v4 (mihomo-rules-fixed.yaml) — проверено на
# ядре 1.19.31: 58 регрессионных кейсов + 1644 хоста, сверка цели И класса
# сработавшего правила (rules_test.py). Плоская v4 остаётся запасным вариантом
# для клиентов/оверрайдов, куда можно вставить только секцию rules:.
# Зачем: доменные наборы матчатся по индексу (trie) вместо ~1000 проверок
# подряд, а политика маршрутизации читается целиком на одном экране.
# Формат payload: +.example.com = домен и все поддомены; example.com = точно.

