<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Builder v8.0 Omni-Core</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        body { 
            background-color: #0d1117; color: #c9d1d9; 
            font-family: 'JetBrains Mono', monospace; margin: 0;
            display: flex; justify-content: center; padding: 40px 20px;
        }

        .container {
            background: #161b22; border: 1px solid #30363d;
            border-radius: 12px; padding: 30px; max-width: 950px; width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h2 { 
            margin-top: 0; color: #58a6ff; font-size: 24px;
            border-bottom: 1px solid #30363d; padding-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .icon-btn {
            background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
            padding: 6px 12px; border-radius: 6px; font-size: 12px;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 5px;
            font-family: inherit; font-weight: bold;
        }
        .icon-btn:hover { background: #30363d; border-color: #8b949e; }
        .icon-btn.primary { background: #238636; border-color: #2ea043; color: white;}
        .icon-btn.primary:hover { background: #2ea043; }
        .icon-btn.danger { background: transparent; color: #f85149; border-color: #30363d; }
        .icon-btn.danger:hover { background: #f85149; color: white; border-color: #f85149; }

        p { font-size: 13px; color: #8b949e; margin-bottom: 15px; line-height: 1.6; }

        textarea { 
            width: 100%; height: 110px; background: #010409; color: #3fb950; 
            border: 2px dashed #30363d; border-radius: 8px; padding: 15px; 
            margin-bottom: 20px; box-sizing: border-box; font-family: inherit;
            resize: vertical; outline: none; transition: all 0.2s ease;
        }
        textarea:focus { border-color: #58a6ff; }
        textarea.dragover { border-color: #58a6ff; background: #161b22; box-shadow: 0 0 15px rgba(88,166,255,0.2); }

        .btn-group { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; align-items: center; }

        button.action-btn, select { 
            border: none; padding: 12px 18px; border-radius: 6px; 
            font-weight: bold; font-family: inherit; cursor: pointer; 
            transition: all 0.2s ease; font-size: 13px;
        }

        select { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; outline: none; }

        .btn-convert { background: #238636; color: #ffffff; }
        .btn-convert:hover { background: #2ea043; }
        .btn-copy { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; display: none; }
        .btn-download { background: #58a6ff; color: #ffffff; display: none; }
        .btn-download:hover { background: #79c0ff; }

        .status-badge {
            background: #1f6feb; color: white; padding: 2px 8px; border-radius: 12px;
            font-size: 11px; margin-left: 10px; display: none; align-items: center;
        }

        .cards-grid {
            display: none; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px; margin-bottom: 20px; max-height: 380px; overflow-y: auto; padding-right: 5px;
        }
        .cards-grid::-webkit-scrollbar { width: 6px; }
        .cards-grid::-webkit-scrollbar-track { background: #010409; border-radius: 3px; }
        .cards-grid::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

        .proxy-card {
            background: #161b22; border: 1px solid #30363d; border-radius: 8px;
            padding: 12px; position: relative; display: flex; flex-direction: column; gap: 6px;
        }
        .proxy-card:hover { border-color: #58a6ff; }
        
        .proxy-name { 
            font-weight: bold; color: #58a6ff; font-size: 13px; white-space: nowrap; 
            overflow: hidden; text-overflow: ellipsis; padding-right: 90px; 
            outline: none; border-bottom: 1px dashed transparent; cursor: text;
        }
        .proxy-name:focus { border-bottom: 1px dashed #58a6ff; }
        
        .proxy-detail { font-size: 11px; color: #8b949e; display: flex; align-items: center; justify-content: space-between;}
        .proxy-type { 
            display: inline-block; color: white; padding: 2px 6px; 
            border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; margin-right: 5px;
        }
        
        .type-vless { background: #238636; }
        .type-hy2 { background: #8957e5; }
        .type-trojan { background: #d29922; }
        .type-vmess { background: #0078d7; }
        .type-ss { background: #3b82f6; }
        .type-ssr { background: #d23bb7; }
        .type-tuic { background: #ea4aaa; }
        .type-wg { background: #d23b3b; }
        .type-socks { background: #3bd2a2; color: #000; }
        .type-http { background: #a2d23b; color: #000; }
        .type-ssh { background: #555; }
        .type-naive { background: #ff7b00; }
        
        .card-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
        .btn-card {
            background: #21262d; border: none; border-radius: 4px; cursor: pointer;
            font-size: 12px; padding: 5px 6px; color: #c9d1d9; min-width: 26px; text-align: center;
        }
        .btn-card:hover { background: #58a6ff; color: white; }
        .btn-card.remove:hover { background: #f85149; color: white; }

        pre { 
            background: #010409; padding: 20px; border: 1px solid #30363d; 
            border-radius: 8px; color: #a5d6ff; overflow-x: auto; 
            max-height: 400px; font-size: 12px; line-height: 1.5;
            white-space: pre-wrap; word-wrap: break-word;
        }

        #toast {
            visibility: hidden; min-width: 200px; background-color: #238636; color: #fff;
            text-align: center; border-radius: 6px; padding: 12px; position: fixed;
            z-index: 100; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 14px;
            opacity: 0; transition: opacity 0.3s, visibility 0.3s;
        }
        #toast.show { visibility: visible; opacity: 1; }

        #qrModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 50; justify-content: center; align-items: center;
        }
        .qr-content {
            background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d;
            text-align: center; max-width: 300px; width: 100%;
        }
        .qr-close {
            background: #f85149; color: white; border: none; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; margin-top: 15px; width: 100%; font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>
            ⚡ Network Builder v8.0 Omni-Core
            <div class="header-actions">
                <button class="icon-btn primary" onclick="pingAll()">⚡ Ping All</button>
                <button class="icon-btn" onclick="sortProxies()">📶 Сортировка</button>
                <button class="icon-btn" onclick="shuffleProxies()">🔀 Перемешать</button>
                <button class="icon-btn" onclick="exportRawNodes()">📥 Бэкап TXT</button>
                <button class="icon-btn danger" onclick="clearAll()">🗑 Очистить</button>
            </div>
        </h2>
        
        <p>Поддержка: VLESS, VMess, Trojan, Hysteria2, SS, SSR, WireGuard, Socks5, HTTP, SSH, Naive, TUIC. <br><b>Перетащите .txt файл прямо в поле ниже или вставьте ссылки.</b></p>
        
        <textarea id="input" placeholder="Drop .txt file here or paste links:
vless://...
wireguard://...
ssh://...
socks5://..."></textarea>
        
        <div class="btn-group">
            <button class="action-btn btn-convert" onclick="startProcess()">► PROCESS NODES</button>
            <span id="nodeCount" class="status-badge">0 Nodes</span>
            
            <select id="exportFormat" style="margin-left: auto;" onchange="updateOutput()">
                <option value="clash_mobile">📱 FlClash YAML (TUN)</option>
                <option value="clash_router">🌐 FlClash YAML (Router)</option>
                <option value="singbox">📦 Sing-box (JSON Outbound)</option>
                <option value="xray">📦 Exclave / Nekobox (JSON)</option>
            </select>
            
            <button id="copyBtn" class="action-btn btn-copy" onclick="copyResult()">⎘ КОПИРОВАТЬ</button>
            <button id="downloadBtn" class="action-btn btn-download" onclick="downloadFile()">⬇ СКАЧАТЬ</button>
        </div>
        
        <div id="cardsContainer" class="cards-grid"></div>
        <pre id="output">Waiting for data...</pre>
    </div>

    <div id="toast">✅ Done!</div>

    <div id="qrModal" onclick="closeQR(event)">
        <div class="qr-content" onclick="event.stopPropagation()">
            <h3 style="margin-top:0; color:#58a6ff;" id="qrTitle">QR Code</h3>
            <canvas id="qrCanvas" style="background: white; padding: 10px; border-radius: 8px;"></canvas>
            <button class="qr-close" onclick="closeQR()">Close</button>
        </div>
    </div>

    <script>
        let currentProxies = []; 

        function safeB64Decode(str) {
            try { return decodeURIComponent(escape(atob(str.replace(/-/g, '+').replace(/_/g, '/')))); } 
            catch(e) { try { return atob(str.replace(/-/g, '+').replace(/_/g, '/')); } catch(e2) { return ""; } }
        }

        // === DRAG AND DROP ===
        const dropZone = document.getElementById('input');
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                const reader = new FileReader();
                reader.onload = (event) => { dropZone.value = event.target.result; showToast(`📁 Файл прочитан!`); };
                reader.readAsText(e.dataTransfer.files[0]);
            }
        });

        window.onload = () => {
            const savedProxies = localStorage.getItem('flclash_net_v8');
            if (savedProxies) { currentProxies = JSON.parse(savedProxies); if (currentProxies.length > 0) renderCards(); }
        };

        function saveState() { localStorage.setItem('flclash_net_v8', JSON.stringify(currentProxies)); }

        function clearAll() {
            if(confirm('Очистить все узлы?')) { currentProxies = []; document.getElementById('input').value = ''; saveState(); renderCards(); }
        }

        function shuffleProxies() {
            if (currentProxies.length < 2) return;
            for (let i = currentProxies.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentProxies[i], currentProxies[j]] = [currentProxies[j], currentProxies[i]];
            }
            saveState(); renderCards(); showToast("🔀 Узлы перемешаны!");
        }

        function sortProxies() {
            if (currentProxies.length < 2) return;
            currentProxies.sort((a, b) => (a.lastPing === undefined ? 99999 : a.lastPing) - (b.lastPing === undefined ? 99999 : b.lastPing));
            saveState(); renderCards(); showToast("📶 Отсортировано по Ping!");
        }

        function exportRawNodes() {
            if (currentProxies.length === 0) return;
            const blob = new Blob([currentProxies.map(p => p.rawLink).join('\n')], { type: 'text/plain' });
            const a = document.createElement('a'); a.href = window.URL.createObjectURL(blob);
            a.download = `Nodes_Backup_${new Date().getTime()}.txt`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        async function startProcess() {
            const input = document.getElementById('input').value.trim();
            const out = document.getElementById('output');
            if (!input) { showToast("Пустое поле!", "#f85149"); return; }

            if (input.startsWith('http') && !input.includes('://') && !input.includes('@')) {
                out.textContent = "⏳ Fetching...";
                try {
                    const res = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(input));
                    parseData(await res.text());
                } catch (e) { out.textContent = "❌ Fetch failed. Paste data manually."; }
            } else { parseData(input); }
        }

        // РАСШИРЕННЫЙ ПАРСЕР ПРОТОКОЛОВ
        function parseData(rawText) {
            let text = rawText.trim();
            let newProxiesCount = 0;

            try {
                let json = JSON.parse(text);
                if (json.outbounds) { showToast("Конвертация из JSON пока не поддерживается, используйте ссылки.", "#d29922"); return; }
            } catch(e){}

            text.split('\n').forEach(line => {
                line = line.trim(); let proxyObj = null;
                try {
                    if (line.startsWith('vless://')) {
                        const url = new URL(line); const p = new URLSearchParams(url.search);
                        proxyObj = {
                            name: decodeURIComponent(url.hash.slice(1)) || "VLESS_" + Math.floor(Math.random()*100),
                            type: "vless", server: url.hostname, port: parseInt(url.port), uuid: url.username,
                            tls: p.get('security') === 'reality' || p.get('security') === 'tls',
                            "reality-opts": p.get('pbk') ? { "public-key": p.get('pbk'), "short-id": p.get('sid') || "" } : undefined,
                            sni: p.get('sni') || url.hostname, network: p.get('type') || "tcp", flow: p.get('flow') || "", fp: p.get('fp') || "chrome", rawLink: line
                        };
                    } else if (line.startsWith('vmess://')) {
                        let b64 = line.slice(8); let decoded = safeB64Decode(b64);
                        if (decoded) {
                            let v = JSON.parse(decoded);
                            proxyObj = {
                                name: v.ps || "VMess_" + Math.floor(Math.random()*100),
                                type: "vmess", server: v.add, port: parseInt(v.port), uuid: v.id,
                                aid: v.aid || 0, network: v.net || "tcp", tls: v.tls === "tls", sni: v.sni || v.host || v.add, rawLink: line
                            };
                        }
                    } else if (line.startsWith('ss://')) {
                        let uri = line.slice(5); let name = "SS_" + Math.floor(Math.random()*100);
                        if (uri.includes('#')) { let parts = uri.split('#'); name = decodeURIComponent(parts[1]); uri = parts[0]; }
                        let method = "", password = "", server = "", port = 0;
                        if (uri.includes('@')) {
                            let parts = uri.split('@'); let userinfo = safeB64Decode(parts[0]) || parts[0];
                            if(userinfo.includes(':')) { let up = userinfo.split(':'); method = up[0]; password = up[1]; }
                            let sp = parts[1].split(':'); server = sp[0]; port = parseInt(sp[1]);
                        } else {
                            let decoded = safeB64Decode(uri);
                            if(decoded.includes('@')) {
                                let parts = decoded.split('@'); let up = parts[0].split(':'); method = up[0]; password = up[1];
                                let sp = parts[1].split(':'); server = sp[0]; port = parseInt(sp[1]);
                            }
                        }
                        if (server && port) proxyObj = { name: name, type: "ss", server: server, port: port, cipher: method, password: password, rawLink: line };
                    } else if (line.startsWith('ssr://')) {
                        let b64 = line.slice(6); let decoded = safeB64Decode(b64);
                        if (decoded) {
                            let parts = decoded.split(':');
                            if (parts.length >= 6) {
                                proxyObj = { name: "SSR_" + Math.floor(Math.random()*100), type: "ssr", server: parts[0], port: parseInt(parts[1]), protocol: parts[2], cipher: parts[3], obfs: parts[4], password: safeB64Decode(parts[5].split('/?')[0]), rawLink: line };
                            }
                        }
                    } else if (line.startsWith('hy2://') || line.startsWith('hysteria2://')) {
                        const url = new URL(line); const p = new URLSearchParams(url.search);
                        proxyObj = {
                            name: decodeURIComponent(url.hash.slice(1)) || "HY2_" + Math.floor(Math.random()*100),
                            type: "hysteria2", server: url.hostname, port: parseInt(url.port), password: url.username,
                            sni: p.get('sni') || url.hostname, "skip-cert-verify": p.get('insecure') === '1',
                            obfs: p.get('obfs') || undefined, "obfs-password": p.get('obfs-password') || undefined, rawLink: line
                        };
                    } else if (line.startsWith('trojan://')) {
                        const url = new URL(line); const p = new URLSearchParams(url.search);
                        proxyObj = {
                            name: decodeURIComponent(url.hash.slice(1)) || "Trojan_" + Math.floor(Math.random()*100),
                            type: "trojan", server: url.hostname, port: parseInt(url.port), password: url.username,
                            tls: true, sni: p.get('sni') || url.hostname, network: p.get('type') || "tcp", fp: p.get('fp') || "chrome", rawLink: line
                        };
                    } else if (line.startsWith('tuic://')) {
                        const url = new URL(line); const p = new URLSearchParams(url.search);
                        proxyObj = { name: decodeURIComponent(url.hash.slice(1)) || "TUIC_" + Math.floor(Math.random()*100), type: "tuic", server: url.hostname, port: parseInt(url.port), uuid: url.username, password: url.password, sni: p.get('sni') || url.hostname, rawLink: line };
                    } else if (line.startsWith('wireguard://') || line.startsWith('wg://')) {
                        let urlStr = line.replace('wireguard://', 'http://').replace('wg://', 'http://');
                        const url = new URL(urlStr); const p = new URLSearchParams(url.search);
                        proxyObj = {
                            name: decodeURIComponent(url.hash.slice(1)) || "WG_" + Math.floor(Math.random()*100), type: "wg", server: url.hostname, port: parseInt(url.port),
                            "private-key": url.username || p.get('privateKey'), "public-key": p.get('publicKey') || p.get('peerPublicKey'),
                            ip: p.get('ip') || "10.0.0.2/32", reserved: p.get('reserved'), rawLink: line
                        };
                    } else if (line.startsWith('socks5://') || line.startsWith('socks://')) {
                        let urlStr = line.replace('socks5://', 'http://').replace('socks://', 'http://');
                        const url = new URL(urlStr);
                        proxyObj = { name: decodeURIComponent(url.hash.slice(1)) || "SOCKS_" + Math.floor(Math.random()*100), type: "socks", server: url.hostname, port: parseInt(url.port), username: url.username, password: url.password, rawLink: line };
                    } else if (line.startsWith('http://') && line.includes('@')) {
                        const url = new URL(line);
                        proxyObj = { name: decodeURIComponent(url.hash.slice(1)) || "HTTP_" + Math.floor(Math.random()*100), type: "http", server: url.hostname, port: parseInt(url.port), username: url.username, password: url.password, rawLink: line };
                    } else if (line.startsWith('ssh://')) {
                        const url = new URL(line);
                        proxyObj = { name: decodeURIComponent(url.hash.slice(1)) || "SSH_" + Math.floor(Math.random()*100), type: "ssh", server: url.hostname, port: parseInt(url.port), username: url.username, password: url.password, rawLink: line };
                    } else if (line.startsWith('naive+https://')) {
                        const url = new URL(line.replace('naive+', ''));
                        proxyObj = { name: decodeURIComponent(url.hash.slice(1)) || "Naive_" + Math.floor(Math.random()*100), type: "naive", server: url.hostname, port: parseInt(url.port), username: url.username, password: url.password, rawLink: line };
                    }

                    if (proxyObj && proxyObj.server && !currentProxies.some(p => p.server === proxyObj.server && p.port === proxyObj.port)) { 
                        currentProxies.push(proxyObj); newProxiesCount++; 
                    }
                } catch (e) {}
            });

            if (newProxiesCount > 0) { document.getElementById('input').value = ''; showToast(`+${newProxiesCount} узлов добавлено`); } 
            else { showToast("Новых узлов не найдено", "#d29922"); }
            saveState(); renderCards();
        }

        async function pingNode(index, button) {
            button.textContent = "⏳"; const start = performance.now();
            try {
                await fetch(`https://${currentProxies[index].server}:${currentProxies[index].port}`, { mode: 'no-cors', cache: 'no-store', signal: AbortSignal.timeout(3000) });
                const ping = Math.round(performance.now() - start);
                button.textContent = `${ping}ms`; button.style.color = "#3fb950"; currentProxies[index].lastPing = ping;
            } catch (e) {
                button.textContent = "Err"; button.style.color = "#f85149"; currentProxies[index].lastPing = 99999;
            }
            saveState();
        }

        async function pingAll() {
            if (currentProxies.length === 0) return; showToast("⏳ Тестирование...", "#d29922");
            const buttons = document.querySelectorAll('.btn-ping');
            await Promise.all(currentProxies.map((_, i) => buttons[i] ? pingNode(i, buttons[i]) : Promise.resolve()));
            showToast("✅ Проверка завершена!");
        }

        function showQR(index) {
            document.getElementById('qrTitle').textContent = currentProxies[index].name;
            new QRious({ element: document.getElementById('qrCanvas'), value: currentProxies[index].rawLink, size: 250, background: 'white', foreground: 'black' });
            document.getElementById('qrModal').style.display = 'flex';
        }
        function closeQR(e) { if (!e || e.target.id === 'qrModal') document.getElementById('qrModal').style.display = 'none'; }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = ''; 

            if (currentProxies.length > 0) {
                document.getElementById('nodeCount').style.display = "inline-flex";
                document.getElementById('nodeCount').textContent = `${currentProxies.length} Nodes`;

                currentProxies.forEach((p, index) => {
                    let typeClass = "type-" + p.type;
                    let pingLabel = p.lastPing === undefined ? "⚡" : (p.lastPing === 99999 ? "Err" : `${p.lastPing}ms`);
                    let pingColor = p.lastPing === undefined ? "#c9d1d9" : (p.lastPing === 99999 ? "#f85149" : "#3fb950");
                    const card = document.createElement('div'); card.className = 'proxy-card';
                    card.innerHTML = `
                        <div class="card-actions">
                            <button class="btn-card btn-ping" style="color: ${pingColor}" onclick="pingNode(${index}, this)" title="Test latency">${pingLabel}</button>
                            <button class="btn-card" onclick="showQR(${index})">📱</button>
                            <button class="btn-card" onclick="copyLink(${index})">🔗</button>
                            <button class="btn-card remove" onclick="removeProxy(${index})">✖</button>
                        </div>
                        <div class="proxy-name" contenteditable="true" spellcheck="false" 
                             onblur="renameProxy(${index}, this.innerText)" 
                             onkeydown="if(event.key === 'Enter'){this.blur(); return false;}">${p.name}</div>
                        <div class="proxy-detail"><div><span class="proxy-type ${typeClass}">${p.type}</span> ${p.server}:${p.port}</div></div>
                    `;
                    container.appendChild(card);
                });
                
                updateOutput(); 
                container.style.display = 'grid';
                document.getElementById('downloadBtn').style.display = "inline-block";
                document.getElementById('copyBtn').style.display = "inline-block";
            } else {
                container.style.display = 'none'; document.getElementById('nodeCount').style.display = "none";
                document.getElementById('output').textContent = "Waiting for data...";
                document.getElementById('downloadBtn').style.display = "none"; document.getElementById('copyBtn').style.display = "none";
            }
        }

        function removeProxy(index) { currentProxies.splice(index, 1); saveState(); renderCards(); }
        function renameProxy(index, newName) {

            const format = document.getElementById('exportFormat').value;
            const ext = (format === 'xray' || format === 'singbox') ? 'json' : 'yaml';
            const filename = `Network_Config_v8.${ext}`;

            navigator.clipboard.writeText(document.getElementById('output').textContent);

        function showToast(message, color = "#238636") {
            const toast = document.getElementById("toast");
