<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlClash VPN Converter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        body { 
            background-color: #0b1116; 
            color: #c9d1d9; 
            font-family: 'JetBrains Mono', monospace; 
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            max-width: 750px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h2 { 
            margin-top: 0; 
            color: #58a6ff; 
            font-size: 24px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 15px;
        }

        p { font-size: 14px; color: #8b949e; }

        textarea { 
            width: 100%; 
            height: 120px; 
            background: #0d1117; 
            color: #3fb950; 
            border: 1px solid #30363d; 
            border-radius: 8px;
            padding: 15px; 
            margin-bottom: 20px; 
            box-sizing: border-box;
            font-family: inherit;
            resize: vertical;
            outline: none;
        }

        .btn-group { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; align-items: center; }

        button, select { 
            border: none; 
            padding: 12px 20px; 
            border-radius: 6px; 
            font-weight: bold; 
            font-family: inherit;
            cursor: pointer; 
            transition: all 0.2s ease;
            font-size: 13px;
        }

        select {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            outline: none;
        }

        .btn-convert { background: #238636; color: #ffffff; }
        .btn-convert:hover { background: #2ea043; }

        .btn-copy { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
        .btn-download { background: #58a6ff; color: #ffffff; display: none; }
        .btn-download:hover { background: #79c0ff; }

        pre { 
            background: #0d1117; 
            padding: 20px; 
            border: 1px solid #30363d; 
            border-radius: 8px;
            color: #a5d6ff; 
            overflow-x: auto; 
            max-height: 350px; 
            font-size: 13px;
            line-height: 1.5;
        }

        .hint { 
            color: #8b949e; 
            font-size: 12px; 
            margin-top: 20px; 
            background: #1c2128; 
            padding: 15px; 
            border-left: 4px solid #58a6ff; 
            border-radius: 0 6px 6px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ FlClash Конвертер</h2>
        <p>Вставьте подписку или vless:// ссылки:</p>
        
        <textarea id="input" placeholder="vless://..."></textarea>
        
        <div class="btn-group">
            <button class="btn-convert" onclick="startProcess()">► КОНВЕРТИРОВАТЬ</button>
            <button class="btn-copy" onclick="copyResult()">⎘ КОПИРОВАТЬ</button>
            
            <select id="extension">
                <option value="yaml">.yaml</option>
                <option value="yml">.yml</option>
                <option value="txt">.txt</option>
            </select>
            
            <button id="downloadBtn" class="btn-download" onclick="downloadFile()">⬇ СКАЧАТЬ ФАЙЛ</button>
        </div>
        
        <pre id="output">Здесь появится готовый конфиг...</pre>

        <div class="hint">
            <strong>Совет:</strong> После появления результата выберите формат и нажмите «Скачать», чтобы сохранить файл для импорта во FlClash.
        </div>
    </div>

    <script>
        async function startProcess() {
            const input = document.getElementById('input').value.trim();
            const out = document.getElementById('output');
            const dlBtn = document.getElementById('downloadBtn');

            if (!input) { out.textContent = "Пустое поле!"; return; }

            if (input.startsWith('http')) {
                out.textContent = "⏳ Загрузка...";
                try {
                    const res = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(input));
                    parseData(await res.text());
                } catch (e) { out.textContent = "❌ Ошибка загрузки."; }
            } else {
                parseData(input);
            }
        }

        function parseData(rawText) {
            let text = rawText.trim();
            const out = document.getElementById('output');
            const dlBtn = document.getElementById('downloadBtn');
            let proxies = [];

            if (!text.includes('vless://') && !text.includes('"outbounds"')) {
                try { text = atob(text.replace(/\s/g, '')); } catch (e) {}
            }

            if (text.includes('vless://')) {
                const lines = text.split('\n');
                lines.forEach(line => {
                    line = line.trim();
                    if (line.startsWith('vless://')) {
                        try {
                            const url = new URL(line);
                            const params = new URLSearchParams(url.search);
                            proxies.push({
                                name: decodeURIComponent(url.hash.slice(1)) || "Server_" + Math.floor(Math.random()*100),
                                type: "vless",
                                server: url.hostname,
                                port: parseInt(url.port),
                                uuid: url.username,
                                tls: params.get('security') === 'reality' || params.get('security') === 'tls',
                                "reality-opts": params.get('pbk') ? { "public-key": params.get('pbk'), "short-id": params.get('sid') || "" } : undefined,
                                sni: params.get('sni') || url.hostname,
                                network: params.get('type') || "tcp",
                                flow: params.get('flow') || "",
                                fp: params.get('fp') || "chrome"
                            });
                        } catch (e) {}
                    }
                });
            }

            if (proxies.length > 0) {
                let yaml = "proxies:\n";
                proxies.forEach(p => {
                    yaml += `  - name: "${p.name}"\n    type: ${p.type}\n    server: ${p.server}\n    port: ${p.port}\n    uuid: ${p.uuid}\n    network: ${p.network}\n    udp: true\n`;
                    if (p.flow) yaml += `    flow: ${p.flow}\n`;
                    if (p.tls) yaml += `    tls: true\n    sni: ${p.sni}\n    client-fingerprint: ${p.fp}\n`;
                    if (p["reality-opts"]) yaml += `    reality-opts:\n      public-key: ${p["reality-opts"]["public-key"]}\n      short-id: ${p["reality-opts"]["short-id"]}\n`;
                });
                out.textContent = yaml;
                dlBtn.style.display = "inline-block"; // Показываем кнопку скачивания
            } else {
                out.textContent = "❌ Серверы не найдены.";
                dlBtn.style.display = "none";
            }
        }

        function downloadFile() {
            const content = document.getElementById('output').textContent;
            const ext = document.getElementById('extension').value;
            const filename = `config_${new Date().getTime()}.${ext}`;
            
            const blob = new Blob([content], { type: 'text/yaml' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }

        function copyResult() {
            const text = document.getElementById('output').textContent;
            if (text.includes('proxies:')) {
                navigator.clipboard.writeText(text);
                const btn = document.querySelector('.btn-copy');
                btn.textContent = "✓ СКОПИРОВАНО";
                setTimeout(() => btn.textContent = "⎘ КОПИРОВАТЬ", 2000);
            }
        }
    </script>
</body>
</html>
