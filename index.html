<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlClash Network Builder</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: 'JetBrains Mono', monospace; 
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            max-width: 850px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h2 { 
            margin-top: 0; 
            color: #58a6ff; 
            font-size: 24px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-actions { display: flex; gap: 10px; }

        .icon-btn {
            background: transparent;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .icon-btn:hover { background: #30363d; color: #c9d1d9; }
        .icon-btn.danger:hover { background: #f85149; color: white; border-color: #f85149; }

        p { font-size: 13px; color: #8b949e; margin-bottom: 15px; line-height: 1.6; }

        textarea { 
            width: 100%; 
            height: 100px;
            background: #010409; 
            color: #3fb950; 
            border: 1px solid #30363d; 
            border-radius: 8px;
            padding: 15px; 
            margin-bottom: 20px; 
            box-sizing: border-box;
            font-family: inherit;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus { border-color: #58a6ff; }

        .btn-group { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; align-items: center; }

        button, select { 
            border: none; 
            padding: 12px 18px; 
            border-radius: 6px; 
            font-weight: bold; 
            font-family: inherit;
            cursor: pointer; 
            transition: all 0.2s ease;
            font-size: 13px;
        }

        select { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; outline: none; }

        .btn-convert { background: #238636; color: #ffffff; }
        .btn-convert:hover { background: #2ea043; }

        .btn-copy { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; display: none; }
        .btn-download { background: #58a6ff; color: #ffffff; display: none; }
        .btn-download:hover { background: #79c0ff; }

        .status-badge {
            background: #1f6feb; color: white; padding: 2px 8px; border-radius: 12px;
            font-size: 11px; margin-left: 10px; display: none; align-items: center;
        }

        .cards-grid {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .cards-grid::-webkit-scrollbar { width: 6px; }
        .cards-grid::-webkit-scrollbar-track { background: #010409; border-radius: 3px; }
        .cards-grid::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

        .proxy-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .proxy-card:hover { border-color: #58a6ff; }
        
        .proxy-name { 
            font-weight: bold; color: #58a6ff; font-size: 13px; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
            padding-right: 50px; outline: none; border-bottom: 1px dashed transparent; cursor: text;
        }
        .proxy-name:focus { border-bottom: 1px dashed #58a6ff; }
        
        .proxy-detail { font-size: 11px; color: #8b949e; }
        .proxy-type { 
            display: inline-block; background: #238636; color: white; 
            padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; 
            text-transform: uppercase; margin-right: 5px;
        }
        
        .card-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 5px; }
        .btn-card {
            background: #21262d; border: none; border-radius: 4px; cursor: pointer;
            font-size: 12px; padding: 5px 7px; color: #c9d1d9;
        }
        .btn-card:hover { background: #58a6ff; color: white; }
        .btn-card.remove:hover { background: #f85149; color: white; }

        pre { 
            background: #010409; padding: 20px; border: 1px solid #30363d; 
            border-radius: 8px; color: #a5d6ff; overflow-x: auto; 
            max-height: 350px; font-size: 12px; line-height: 1.5;
        }

        #toast {
            visibility: hidden; min-width: 200px; background-color: #238636; color: #fff;
            text-align: center; border-radius: 6px; padding: 12px; position: fixed;
            z-index: 10; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 14px;
            opacity: 0; transition: opacity 0.3s, visibility 0.3s;
        }
        #toast.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <h2>
            ⚡ Network Builder v77
            <div class="header-actions">
                <button class="icon-btn" onclick="shuffleProxies()" title="Перемешать список для балансировки нагрузки">🔀 Shuffle</button>
                <button class="icon-btn danger" onclick="clearAll()">🗑 Clear</button>
            </div>
        </h2>
        
        <p>Утилита для генерации профилей маршрутизации. Вставьте список узлов (vless://), и скрипт интегрирует их в базовый сетевой профиль.</p>
        
        <textarea id="input" placeholder="Paste nodes here..."></textarea>
        
        <div class="btn-group">
            <button class="btn-convert" onclick="startProcess()">► BUILD CONFIG</button>
            <span id="nodeCount" class="status-badge">0 Nodes</span>
            
            <button id="copyBtn" class="btn-copy" onclick="copyResult()" style="margin-left: auto;">⎘ COPY YAML</button>
            <select id="extension">
                <option value="yaml">.yaml</option>
                <option value="yml">.yml</option>
            </select>
            <button id="downloadBtn" class="btn-download" onclick="downloadFile()">⬇ DOWNLOAD</button>
        </div>
        
        <div id="cardsContainer" class="cards-grid"></div>
        <pre id="output">Waiting for nodes...</pre>
    </div>

    <div id="toast">✅ Done!</div>

    <script>
        let currentProxies = []; 

        window.onload = () => {
            const savedProxies = localStorage.getItem('flclash_net_proxies');
            if (savedProxies) {
                currentProxies = JSON.parse(savedProxies);
                if (currentProxies.length > 0) renderCards();
            }
        };

        function saveState() {
            localStorage.setItem('flclash_net_proxies', JSON.stringify(currentProxies));
        }

        function clearAll() {
            if(confirm('Clear all nodes?')) {
                currentProxies = [];
                document.getElementById('input').value = '';
                saveState();
                renderCards();
            }
        }

        // Функция перемешивания серверов (алгоритм Фишера-Йетса)
        function shuffleProxies() {
            if (currentProxies.length < 2) return;
            for (let i = currentProxies.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentProxies[i], currentProxies[j]] = [currentProxies[j], currentProxies[i]];
            }
            saveState();
            renderCards();
            showToast("🔀 Список узлов перемешан!");
        }

        async function startProcess() {
            const input = document.getElementById('input').value.trim();
            const out = document.getElementById('output');

            if (!input) { showToast("Input is empty!", "#f85149"); return; }

            if (input.startsWith('http')) {
                out.textContent = "⏳ Fetching...";
                try {
                    const res = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(input));
                    parseData(await res.text());
                } catch (e) { out.textContent = "❌ Fetch failed. Paste data manually."; }
            } else {
                parseData(input);
            }
        }

        function parseData(rawText) {
            let text = rawText.trim();
            if (!text.includes('vless://') && !text.includes('"outbounds"')) {
                try { text = atob(text.replace(/\s/g, '')); } catch (e) {}
            }

            let newProxiesCount = 0;
            if (text.includes('vless://')) {
                const lines = text.split('\n');
                lines.forEach(line => {
                    line = line.trim();
                    if (line.startsWith('vless://')) {
                        try {
                            const url = new URL(line);
                            const params = new URLSearchParams(url.search);
                            const isDuplicate = currentProxies.some(p => p.server === url.hostname && p.port === parseInt(url.port));
                            
                            if (!isDuplicate) {
                                currentProxies.push({
                                    name: decodeURIComponent(url.hash.slice(1)) || "Node_" + Math.floor(Math.random()*100),
                                    type: "vless",
                                    server: url.hostname,
                                    port: parseInt(url.port),
                                    uuid: url.username,
                                    tls: params.get('security') === 'reality' || params.get('security') === 'tls',
                                    "reality-opts": params.get('pbk') ? { "public-key": params.get('pbk'), "short-id": params.get('sid') || "" } : undefined,
                                    sni: params.get('sni') || url.hostname,
                                    network: params.get('type') || "tcp",
                                    flow: params.get('flow') || "",
                                    fp: params.get('fp') || "chrome"
                                });
                                newProxiesCount++;
                            }
                        } catch (e) {}
                    }
                });
            }

            if (newProxiesCount > 0) {
                document.getElementById('input').value = '';
                showToast(`+${newProxiesCount} nodes added`);
            } else {
                showToast("No new valid nodes found.", "#d29922");
            }
            saveState();
            renderCards();
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            const dlBtn = document.getElementById('downloadBtn');
            const copyBtn = document.getElementById('copyBtn');
            const nodeBadge = document.getElementById('nodeCount');

            container.innerHTML = ''; 

            if (currentProxies.length > 0) {
                nodeBadge.style.display = "inline-flex";
                nodeBadge.textContent = `${currentProxies.length} Nodes`;

                currentProxies.forEach((p, index) => {
                    const card = document.createElement('div');
                    card.className = 'proxy-card';
                    card.innerHTML = `
                        <div class="card-actions">
                            <button class="btn-card" onclick="copyVless(${index})" title="Copy link">🔗</button>
                            <button class="btn-card remove" onclick="removeProxy(${index})" title="Remove">✖</button>
                        </div>
                        <div class="proxy-name" contenteditable="true" spellcheck="false" 
                             onblur="renameProxy(${index}, this.innerText)" 
                             onkeydown="if(event.key === 'Enter'){this.blur(); return false;}">${p.name}</div>
                        <div class="proxy-detail"><span class="proxy-type">${p.type}</span> ${p.server}:${p.port}</div>
                    `;
                    container.appendChild(card);
                });
                
                generateYAML(); 
                container.style.display = 'grid';
                dlBtn.style.display = "inline-block";
                copyBtn.style.display = "inline-block";
            } else {
                container.style.display = 'none';
                nodeBadge.style.display = "none";
                document.getElementById('output').textContent = "Waiting for nodes...";
                dlBtn.style.display = "none";
                copyBtn.style.display = "none";
            }
        }

        function removeProxy(index) { currentProxies.splice(index, 1); saveState(); renderCards(); }
        function renameProxy(index, newName) {
            const cleanName = newName.trim().replace(/\n/g, '');
            if (cleanName) currentProxies[index].name = cleanName;
            saveState(); generateYAML();
        }

        function copyVless(index) {
            const p = currentProxies[index];
            let url = `vless://${p.uuid}@${p.server}:${p.port}?type=${p.network}&security=${p.tls?'reality':'none'}&sni=${p.sni}&fp=${p.fp}`;
            if (p.flow) url += `&flow=${p.flow}`;
            if (p["reality-opts"]) url += `&pbk=${p["reality-opts"]["public-key"]}&sid=${p["reality-opts"]["short-id"]}`;
            url += `#${encodeURIComponent(p.name)}`;
            navigator.clipboard.writeText(url);
            showToast("🔗 Link copied!");
        }

        // === СТЕЛС-ИНТЕГРАЦИЯ УНИВЕРСАЛЬНОГО КОНФИГА ===
        function generateYAML() {
            if (currentProxies.length === 0) return;

            let proxiesYAML = "proxies:\n";
            currentProxies.forEach(p => {
                proxiesYAML += `  - name: "${p.name}"\n    type: ${p.type}\n    server: ${p.server}\n    port: ${p.port}\n    uuid: ${p.uuid}\n    network: ${p.network}\n    udp: true\n`;
                if (p.flow) proxiesYAML += `    flow: ${p.flow}\n`;
                if (p.tls) proxiesYAML += `    tls: true\n    sni: ${p.sni}\n    client-fingerprint: ${p.fp}\n`;
                if (p["reality-opts"]) proxiesYAML += `    reality-opts:\n      public-key: ${p["reality-opts"]["public-key"]}\n      short-id: ${p["reality-opts"]["short-id"]}\n`;
            });

            const proxyNames = currentProxies.map(p => `      - "${p.name}"`).join('\n');

            const finalYAML = `# ─────────────────────────────────────────────
# UNIVERSAL ROUTING PROFILE v77.0
